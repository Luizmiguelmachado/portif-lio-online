<script>
    const idioma = document.getElementById("idioma");
    const outros = document.getElementById("outros-idiomas");
    const br = document.getElementById("br");
    const usa = document.getElementById("usa");
    const navegacao = document.querySelectorAll(".navegacao > div");

    idioma.addEventListener("click", () =>{
        event.stopPropagation();
        outros.style.display = "block";
        if(idioma.firstElementChild.src == "https://circle-flags.cdn.skk.moe/flags/br.svg"){
            br.style.filter="grayscale(100%)";
            br.style.cursor= "not-allowed";
            usa.style.filter="none";
            usa.style.cursor= "pointer";
        }
        if(idioma.firstElementChild.src == "https://circle-flags.cdn.skk.moe/flags/us.svg"){
            usa.style.filter="grayscale(100%)";
            usa.style.cursor= "not-allowed";
            br.style.filter="none";
            br.style.cursor= "pointer";
        }
    });
    document.addEventListener("click", () =>{
        outros.style.display = "none";
    });

    br.addEventListener("click", () =>{
        if(idioma.firstElementChild.src == "https://circle-flags.cdn.skk.moe/flags/us.svg")
            idioma.firstElementChild.src = "https://circle-flags.cdn.skk.moe/flags/br.svg";
    });

    usa.addEventListener("click", () =>{
        if(idioma.firstElementChild.src == "https://circle-flags.cdn.skk.moe/flags/br.svg")
            idioma.firstElementChild.src = "https://circle-flags.cdn.skk.moe/flags/us.svg";
    });

    navegacao.forEach((item) => {

        item.addEventListener("click", () => {

            navegacao.forEach((nav) => {
                nav.children[1].classList.remove("bolinha");
                nav.children[1].classList.add("bolinha-desativado");
            });

            item.children[1].classList.remove("bolinha-desativado");
            item.children[1].classList.add("bolinha");

        });

    });
</script>
